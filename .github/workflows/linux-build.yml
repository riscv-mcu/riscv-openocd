on: pull_request

name: Linux Build

jobs:
  # 32-bit, clang
  build32:
    runs-on: ubuntu-latest
    env:
      CFLAGS: -m32
      CC: clang
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install required packages (apt-get)
        run: |
          sudo apt-get update
          sudo apt-get install clang gcc-multilib
      - name: Fetch submodules
        run: |
          # Change gitlab.zapb.de/libjaylink to repo.or.cz/libjaylink to avoid
          # bad network issue, same as .gitlab-ci.yml
          sed -i 's|gitlab.zapb.de/libjaylink|repo.or.cz|g' .gitmodules
          git submodule sync
          # retry submodule update in max_retries times
          max_retries=3
          attempt=1
          while [ $attempt -le $max_retries ]; do
              git submodule update --force --recursive --init && break || {
                  echo "Attempt $attempt failed, retrying..."
                  attempt=$((attempt + 1))
                  sleep 1
              }
          done
          if [ $attempt -gt $max_retries ]; then
              echo "Failed to update submodules after $max_retries attempts."
              exit 1
          fi
          git submodule status
      - run: ./bootstrap
      - run: ./configure --enable-remote-bitbang --enable-jtag_vpi --disable-target64 --disable-werror
      - run: make -j`nproc`
      - run: file src/openocd | grep 32-bit
      - run: src/openocd --version

  # 64-bit, gcc
  build64:
    runs-on: ubuntu-latest
    env:
      CFLAGS: -m64
      CC: gcc
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure environment
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "NAME=openocd64-$TAG" >> $GITHUB_ENV
      - name: Install required packages (apt-get)
        run: |
          sudo apt-get update
          sudo apt-get install libusb-1.0-0 libusb-1.0-0-dev
          sudo apt-get install libftdi1-2 libftdi1-dev
      - name: Fetch submodules
        run: |
          # Change gitlab.zapb.de/libjaylink to repo.or.cz/libjaylink to avoid
          # bad network issue, same as .gitlab-ci.yml
          sed -i 's|gitlab.zapb.de/libjaylink|repo.or.cz|g' .gitmodules
          git submodule sync
          # retry submodule update in max_retries times
          max_retries=3
          attempt=1
          while [ $attempt -le $max_retries ]; do
              git submodule update --force --recursive --init && break || {
                  echo "Attempt $attempt failed, retrying..."
                  attempt=$((attempt + 1))
                  sleep 1
              }
          done
          if [ $attempt -gt $max_retries ]; then
              echo "Failed to update submodules after $max_retries attempts."
              exit 1
          fi
          git submodule status
      - run: ./bootstrap
      - run: ./configure --enable-remote-bitbang --enable-jtag_vpi --enable-ftdi-cjtag --enable-jlink --enable-ftdi --disable-werror
      - run: make -j`nproc`
      - name: Check that we built something
        run: |
          file src/openocd | grep 64-bit
          src/openocd --version
      - name: Package
        # Package into tgz so that github stores a compressed artifact, even
        # though it zips that artifact again before it sends it back to be
        # downloaded.
        run: |
          make install
          tar zcvf ${{ env.NAME }}.tgz -C /tmp ${{ env.NAME }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tgz
